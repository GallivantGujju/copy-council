name: checks

on:
  push:
  pull_request:

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Deterministic evals
        run: python3 scripts/run_evals.py
      - name: Link check
        run: python3 scripts/check_links.py
